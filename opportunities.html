<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASGate - الفرص البيعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- إصلاح الرعشة: حجز مساحة النافبار ثابت -->
    <style>
        *{box-sizing:border-box}
        #navbarPlaceholder{
            height:58px;
            min-height:58px;
            max-height:58px;
            flex-shrink:0;
            width:100%;
            background:#ffffff;
            display:block;
            box-sizing:border-box;
            border-bottom:1px solid #e2e8f0;
        }
        .dashboard-container{
            display:flex;
            flex-direction:column;
            height:100vh;
            opacity:1 !important;
        }
        .table-wrapper{min-height:200px}
    </style>
    <link rel="stylesheet" href="opportunities.css">
</head>
<body>

<div class="dashboard-container">
    <!-- Navbar ثابت لمنع الرعشة -->
    <div id="navbarPlaceholder">
        <nav class="top-navbar" data-unified="true">
            <div style="display:flex; align-items:center; gap:20px; height:100%;">
                <div class="nav-brand">
                    <i class="fas fa-layer-group" style="color:#2563eb;"></i> ASGate
                </div>
                <ul class="nav-links">
                    <li><a href="./index.html" id="nav-index"><i class="fas fa-home"></i> الرئيسية</a></li>
                    <li><a href="./visits.html" id="nav-visits"><i class="fas fa-map-marker-alt"></i> الزيارات</a></li>
                    <li><a href="./opportunities.html" id="nav-opportunities" class="active"><i class="fas fa-lightbulb"></i> الفرص</a></li>
                    <li><a href="./customers.html" id="nav-customers"><i class="fas fa-users"></i> العملاء</a></li>
                    <li><a href="./sales.html" id="nav-sales"><i class="fas fa-shopping-cart"></i> المبيعات</a></li>
                    <li><a href="./reminders.html" id="nav-reminders"><i class="fas fa-bell"></i> التذكيرات</a></li>
                </ul>
            </div>
            <div style="display:flex; align-items:center; gap:12px; height:100%;">
                <div class="nav-search-container">
                    <div class="nav-search-input-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="globalSearchInput" placeholder="بحث شامل في النظام...">
                    </div>
                    <div id="searchResults" class="search-results-dropdown"></div>
                </div>
                <div class="nav-actions">
                    <button class="nav-btn" id="darkModeToggle" title="الوضع الليلي"><i class="fas fa-moon"></i></button>
                </div>
            </div>
        </nav>
    </div>

    <div class="main-content">
        <div class="action-bar">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="بحث في الصفحة 🔍" onkeyup="debouncedFilterTable()">
            </div>
            
            <div class="stats-bar-visit">
                <div class="stat-item">الكل: <span id="stat-total" class="stat-val">0</span></div>
                <div class="stat-item">هذا الشهر (مهتم): <span id="stat-month" class="stat-val">0</span></div>
                <div class="stat-item">اليوم (مهتم): <span id="stat-today" class="stat-val">0</span></div>
                <div class="stat-divider">|</div>
                <div class="stat-item">القيمة الإجمالية (مهتم): <span id="stat-value-total" class="stat-val" style="color: #059669; background: #ecfdf5;">0</span></div>
                <div class="stat-item">قيمة الشهر (مهتم): <span id="stat-value-month" class="stat-val" style="color: #059669; background: #ecfdf5;">0</span></div>
            </div>

                                                <div class="bulk-action-wrapper">
                <button class="btn-bulk-trigger" onclick="toggleDropdown(event, this)">إجراءات جماعية <i class="fas fa-chevron-down" style="font-size:10px;"></i></button>
                <div class="dropdown-menu">
                    <button onclick="handleBulkAction('تغيير المستخدم')"><i class="fas fa-user-edit"></i> تغيير المستخدم</button>
                    <button onclick="handleBulkAction('استيراد')"><i class="fas fa-file-import"></i> استيراد</button>
                    <button onclick="handleBulkAction('تصدير')"><i class="fas fa-file-excel"></i> تصدير</button>
                    <button onclick="handleBulkAction('طباعة')"><i class="fas fa-print"></i> طباعة</button>
                    <hr style="border:none; border-top:1px solid #e2e8f0; margin: 4px 0;">
                    <button class="del-btn" onclick="handleBulkAction('حذف')"><i class="fas fa-trash-alt"></i> حذف</button>
                </div>
                <input type="file" id="importFileInput" accept=".xlsx,.xls,.csv" style="display:none">
            </div>
        </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- سجل النشاط العام -->
        <div id="activityLogSection" class="activity-log-section">
            <div class="activity-log-header-container">
                <div class="activity-log-title"><i class="fas fa-history"></i> سجل نشاط الفرص البيعية</div>
                <button id="toggleExpandBtn" class="btn-toggle-expand" onclick="toggleLogExpansion()" title="توسيع / تقليص"><i class="fas fa-expand-alt"></i></button>
            </div>
            <div id="activityList" class="activity-list"></div>
        </div>
    </div>
</div>

<!-- نافذة الملاحظات -->
<div id="noteModal" class="modal-notes">
    <div class="modal-notes-content">
        <div style="font-weight: 800; color: #1e293b; font-size:14px; margin-bottom: 15px; display:flex; align-items:center; gap:8px;">
            <i class="fas fa-sticky-note" style="color:var(--accent-blue)"></i> سجل ملاحظات الفرصة
        </div>
        <div id="historyLog" class="history-log"></div>
        <textarea id="modalTextArea" class="note-area" placeholder="أدخل تفاصيل الملاحظة هنا..."></textarea>
        <div style="display:flex; justify-content: flex-end; gap:10px; margin-top:15px;">
            <button onclick="closeNote()" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#475569; padding:8px 20px; border-radius:6px; cursor:pointer; font-family:Cairo; font-size:11.5px; font-weight:700;">إلغاء</button>
            <button onclick="saveNote()" style="background:var(--accent-blue); border:none; color:white; padding:8px 20px; border-radius:6px; cursor:pointer; font-family:Cairo; font-size:11.5px; font-weight:800; box-shadow: 0 2px 4px rgba(59,130,246,0.3);">حفظ الملاحظة</button>
        </div>
    </div>
</div>

<!-- التقويم المتحرك المخصص -->
<div class="calendar-overlay" id="calendarOverlay">
    <div class="custom-datepicker">
        <div class="datepicker-header">
            <div class="datepicker-nav-row">
                <div class="nav-group">
                    <i class="fas fa-chevron-left month-nav-btn" id="prevMonthBtn" title="الشهر السابق"></i>
                    <span class="datepicker-display" id="calMonthDisplay">January</span>
                    <i class="fas fa-chevron-right month-nav-btn" id="nextMonthBtn" title="الشهر القادم"></i>
                </div>
                <div class="nav-group year-group">
                    <i class="fas fa-chevron-left month-nav-btn" id="prevYearBtn" title="السنة السابقة"></i>
                    <span class="datepicker-display" id="calYearDisplay">2025</span>
                    <i class="fas fa-chevron-right month-nav-btn" id="nextYearBtn" title="السنة القادمة"></i>
                </div>
            </div>
        </div>

        <div class="weekdays-grid">
            <span>Su</span>
            <span>Mo</span>
            <span>Tu</span>
            <span>We</span>
            <span>Th</span>
            <span class="weekend-day">Fr</span>
            <span class="weekend-day">Sa</span>
        </div>

        <div class="days-container">
            <div class="days-grid" id="calDaysGrid"></div>
        </div>

        <div class="datepicker-footer">
            <button class="btn-cancel" id="calCancelBtn">إلغاء</button>
            <div class="action-buttons">
                <button class="btn-clear-date" id="calClearBtn">مسح</button>
                <button class="btn-next" id="calNextBtn">تأكيد</button>
            </div>
        </div>
    </div>
</div>

<!-- ربط ملفات الجافاسكريبت -->
<script type="module" src="firebase-config.js"></script>
<script type="module" src="navbar.js"></script>
<script type="module" src="opportunities.js"></script>

</body>
</html>
